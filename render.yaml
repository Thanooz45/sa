services:
  - type: web
    name: secret-agent-backend
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5001
      - key: CORS_ORIGIN
        value: '*'
      - key: MAX_DOWNLOAD_SIZE_BYTES
        value: 524288000
      - key: YTDLP_CONCURRENT_FRAGMENTS
        value: 4
      - key: TEMP_DIR
        value: /tmp/secret-agent
